[package]
name = "flux_lang"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fluxc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
parking_lot = "0.12"
crossbeam = "0.8"
cranelift = "0.102"
cranelift-module = "0.102"
cranelift-object = "0.102"
cranelift-codegen = "0.102"
target-lexicon = "0.12"
object = "0.32"
wasm-encoder = "0.216"

[dev-dependencies]
tempfile = "3.8"
